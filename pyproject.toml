[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visitkorea-wellness-tourism-mcp"
version = "1.0.0"
description = "Stateless MCP server for the Korea Tourism Organization Wellness Tourism API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "mcp[cli]>=1.27.0,<2.0.0",
  "httpx>=0.27.0",
  "starlette>=0.37.0",
  "uvicorn>=0.29.0",
  "uvloop>=0.19.0",
  "asyncpg>=0.30.0,<1.0.0",
]

[project.scripts]
visitkorea-wellness-mcp = "mcp_server.main:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]